<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quinto — Controle Financeiro</title>
<meta name="theme-color" content="#0F1720" />
<meta name="description" content="Controle financeiro pessoal com lançamentos por quinzena, metas e calculadoras." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0F1720; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo } = React;

// ---------- Design tokens ----------
const C = {
  bg: "#0F1720", surface: "#16202B", surfaceAlt: "#1C2833", border: "#293544",
  gold: "#D4A24C", goldSoft: "#3A3020", teal: "#5BAE9E", tealSoft: "#16302B",
  brick: "#C4634A", brickSoft: "#331F1C", text: "#EDE7DA", textMuted: "#8B96A3", textFaint: "#5C6674",
};
const displayFont = "'Newsreader', Georgia, serif";
const bodyFont = "'IBM Plex Sans', system-ui, sans-serif";
const monoFont = "'IBM Plex Mono', monospace";
const fmt = (n) => (isNaN(n) ? 0 : n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const EXPENSE_CATS = ["Moradia", "Alimentação", "Transporte", "Lazer", "Saúde", "Educação", "Investimento", "Outros"];
const INCOME_CATS = ["Salário", "Freelance", "Rendimentos", "Outros"];

// ---------- Icons (hand-drawn, lucide-style, no dependency) ----------
function Icon({ name, size = 18, color = "currentColor", style }) {
  const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "wallet": return <svg {...p}><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M16 14h2"/></svg>;
    case "trending-up": return <svg {...p}><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>;
    case "target": return <svg {...p}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>;
    case "calculator": return <svg {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="18"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/></svg>;
    case "plus": return <svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case "trash": return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg>;
    case "arrow-up-right": return <svg {...p}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="8 7 17 7 17 16"/></svg>;
    case "arrow-down-right": return <svg {...p}><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 8 17 17 8 17"/></svg>;
    case "piggy-bank": return <svg {...p}><path d="M19 5c-1.5-1.5-4-2-6-2-4.4 0-8 2.9-8 7 0 1.7.6 3 1.5 4V17a1 1 0 0 0 1 1H9v2h4v-2h1l1-1.3c1.7-.3 3-1 4-2.2"/><circle cx="16" cy="9" r="0.8" fill={color}/><path d="M19 8h2l-1 3"/></svg>;
    case "x": return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "chevron-right": return <svg {...p}><polyline points="9 6 15 12 9 18"/></svg>;
    case "sparkles": return <svg {...p}><path d="M12 3v5M12 16v5M4 12h5M15 12h5"/><path d="M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>;
    case "landmark": return <svg {...p}><line x1="3" y1="21" x2="21" y2="21"/><path d="M4 21V10M10 21V10M14 21V10M20 21V10"/><path d="M2 10l10-6 10 6"/></svg>;
    case "refresh": return <svg {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 15-4l4 4M20.5 15a9 9 0 0 1-15 4l-4-4"/></svg>;
    case "shield-alert": return <svg {...p}><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16"/></svg>;
    case "check-circle": return <svg {...p}><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg>;
    case "eye": return <svg {...p}><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>;
    case "eye-off": return <svg {...p}><path d="M3 3l18 18"/><path d="M10.6 5.1A11 11 0 0 1 12 5c7 0 11 7 11 7a13.4 13.4 0 0 1-2.6 3.4M6.6 6.6A13.6 13.6 0 0 0 1 12s4 7 11 7a10.6 10.6 0 0 0 4.2-.8"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>;
    default: return null;
  }
}

// ---------- Quinzena helpers ----------
function quinzenaLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDate();
  let m = d.getMonth(), y = d.getFullYear();
  if (day >= 5 && day <= 19) return { key: `${y}-${String(m + 1).padStart(2, "0")}-A`, short: "1ª quinzena", order: y * 24 + m * 2 };
  if (day >= 20) return { key: `${y}-${String(m + 1).padStart(2, "0")}-B`, short: "2ª quinzena", order: y * 24 + m * 2 + 1 };
  m -= 1;
  if (m < 0) { m = 11; y -= 1; }
  return { key: `${y}-${String(m + 1).padStart(2, "0")}-B`, short: "2ª quinzena", order: y * 24 + m * 2 + 1 };
}
function nextPayday() {
  const today = new Date();
  const day = today.getDate();
  const d = new Date(today);
  if (day < 5) d.setDate(5);
  else if (day < 20) d.setDate(20);
  else { d.setMonth(d.getMonth() + 1); d.setDate(5); }
  const diff = Math.ceil((d.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000);
  return { diff, label: d.getDate() === 5 ? "dia 5" : "dia 20" };
}
function monthKey(dateStr) { return dateStr.slice(0, 7); }

// ---------- Storage (localStorage) ----------
function loadKey(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// ---------- Pluggy API ----------
const PLUGGY_BASE = "https://api.pluggy.ai";
async function pluggyAuth(clientId, clientSecret) {
  const res = await fetch(`${PLUGGY_BASE}/auth`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clientId, clientSecret }) });
  if (!res.ok) throw new Error(`Falha na autenticação (${res.status})`);
  return (await res.json()).apiKey;
}
async function pluggyGet(path, apiKey) {
  const res = await fetch(`${PLUGGY_BASE}${path}`, { headers: { "X-API-KEY": apiKey } });
  if (!res.ok) throw new Error(`Erro na API Pluggy (${res.status})`);
  return res.json();
}
async function syncPluggy(clientId, clientSecret) {
  const apiKey = await pluggyAuth(clientId, clientSecret);
  const itemsRes = await pluggyGet("/items", apiKey);
  const items = itemsRes.results || [];
  let allAccounts = [], allTx = [];
  for (const item of items) {
    const accRes = await pluggyGet(`/accounts?itemId=${item.id}`, apiKey);
    const accounts = accRes.results || [];
    allAccounts = allAccounts.concat(accounts.map((a) => ({ id: a.id, name: `${item.connector?.name || "Banco"} · ${a.name || a.type}`, balance: a.balance || 0 })));
    for (const acc of accounts) {
      const txRes = await pluggyGet(`/transactions?accountId=${acc.id}&pageSize=200`, apiKey);
      const txs = txRes.results || [];
      allTx = allTx.concat(txs.map((t) => ({
        id: `pluggy-${t.id}`, externalId: t.id, type: t.amount >= 0 ? "income" : "expense",
        amount: Math.abs(t.amount), category: t.category || "Outros", description: t.description || "",
        date: (t.date || "").slice(0, 10), synced: true,
      })));
    }
  }
  return { accounts: allAccounts, transactions: allTx };
}

// ---------- UI primitives ----------
function Card({ children, style }) {
  return <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, ...style }}>{children}</div>;
}
function Pill({ children, tone = "muted" }) {
  const tones = { muted: { bg: C.surfaceAlt, color: C.textMuted }, gold: { bg: C.goldSoft, color: C.gold }, teal: { bg: C.tealSoft, color: C.teal }, brick: { bg: C.brickSoft, color: C.brick } };
  const t = tones[tone];
  return <span style={{ background: t.bg, color: t.color, fontFamily: bodyFont, fontSize: 12, fontWeight: 600, padding: "3px 9px", borderRadius: 999 }}>{children}</span>;
}
function NumberField({ label, value, onChange, suffix, placeholder }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 6, fontFamily: bodyFont }}>
      <span style={{ fontSize: 12.5, color: C.textMuted }}>{label}</span>
      <div style={{ display: "flex", alignItems: "center", background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px" }}>
        <input type="number" value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)}
          style={{ background: "transparent", border: "none", outline: "none", color: C.text, fontFamily: monoFont, fontSize: 15, width: "100%" }} />
        {suffix && <span style={{ color: C.textFaint, fontSize: 13 }}>{suffix}</span>}
      </div>
    </label>
  );
}
function Button({ children, onClick, variant = "primary", full }) {
  const styles = { primary: { background: C.gold, color: "#1A1408" }, ghost: { background: "transparent", color: C.text, border: `1px solid ${C.border}` }, danger: { background: C.brickSoft, color: C.brick } };
  return (
    <button onClick={onClick} style={{ ...styles[variant], fontFamily: bodyFont, fontWeight: 600, fontSize: 14, padding: "10px 16px", borderRadius: 10, border: styles[variant].border || "none", cursor: "pointer", width: full ? "100%" : "auto", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
      {children}
    </button>
  );
}
function Section({ title, children }) {
  return <Card><div style={{ fontFamily: displayFont, fontSize: 16, color: C.text, marginBottom: 12 }}>{title}</div>{children}</Card>;
}
function EmptyHint({ text }) { return <div style={{ color: C.textFaint, fontSize: 13, fontStyle: "italic" }}>{text}</div>; }
function Modal({ title, children, onClose }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(6,10,14,0.7)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.surface, borderTop: `1px solid ${C.border}`, borderRadius: "18px 18px 0 0", padding: 20, width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <span style={{ fontFamily: displayFont, fontSize: 18, color: C.text }}>{title}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="x" size={18} color={C.textFaint} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}
function StatRow({ label, value, tone, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderTop: `1px solid ${C.border}` }}>
      <span style={{ color: C.textMuted, fontSize: 13 }}>{label}</span>
      <span style={{ fontFamily: big ? displayFont : monoFont, fontSize: big ? 22 : 15, color: tone === "teal" ? C.teal : C.text }}>{value}</span>
    </div>
  );
}

// ---------- Custom charts (no external lib) ----------
function SimpleBarChart({ data, valueKey, labelKey }) {
  const max = Math.max(1, ...data.map((d) => Math.abs(d[valueKey])));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 140, padding: "6px 0" }}>
      {data.map((d, i) => {
        const h = Math.max(3, (Math.abs(d[valueKey]) / max) * 100);
        const positive = d[valueKey] >= 0;
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <div style={{ width: "100%", height: 100, display: "flex", alignItems: "flex-end" }}>
              <div style={{ width: "100%", height: `${h}%`, borderRadius: "4px 4px 2px 2px", background: positive ? C.teal : C.brick }} title={fmt(d[valueKey])} />
            </div>
            <span style={{ fontSize: 10, color: C.textFaint }}>{d[labelKey]}</span>
          </div>
        );
      })}
    </div>
  );
}
function SimpleLineChart({ series, height = 150 }) {
  const w = 320;
  const maxVal = Math.max(1, ...series.map((s) => s.total));
  const pts = (key) => series.map((s, i) => {
    const x = (i / Math.max(1, series.length - 1)) * w;
    const y = height - (s[key] / maxVal) * (height - 10) - 5;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      {[0.25, 0.5, 0.75].map((f) => <line key={f} x1="0" x2={w} y1={height * f} y2={height * f} stroke={C.border} strokeWidth="1" />)}
      <polyline points={pts("invested")} fill="none" stroke={C.textFaint} strokeWidth="2" />
      <polyline points={pts("total")} fill="none" stroke={C.gold} strokeWidth="2.5" />
    </svg>
  );
}

// ---------- Main App ----------
function App() {
  const [tab, setTab] = useState("dashboard");
  const [transactions, setTransactions] = useState(() => loadKey("quinzena-transactions", []));
  const [goals, setGoals] = useState(() => loadKey("quinzena-goals", []));
  const [bankCreds, setBankCreds] = useState(() => loadKey("quinzena-bank-creds", null));
  const [bankAccounts, setBankAccounts] = useState(() => loadKey("quinzena-bank-accounts", []));
  const [lastSync, setLastSync] = useState(() => loadKey("quinzena-last-sync", null));

  useEffect(() => { saveKey("quinzena-transactions", transactions); }, [transactions]);
  useEffect(() => { saveKey("quinzena-goals", goals); }, [goals]);
  useEffect(() => { saveKey("quinzena-bank-creds", bankCreds); }, [bankCreds]);
  useEffect(() => { saveKey("quinzena-bank-accounts", bankAccounts); }, [bankAccounts]);
  useEffect(() => { saveKey("quinzena-last-sync", lastSync); }, [lastSync]);

  function mergeSyncedTransactions(fetched) {
    setTransactions((prev) => {
      const existingIds = new Set(prev.filter((t) => t.externalId).map((t) => t.externalId));
      return [...prev, ...fetched.filter((t) => !existingIds.has(t.externalId))];
    });
  }

  const today = new Date().toISOString().slice(0, 10);
  const currentMonth = monthKey(today);
  const monthTx = useMemo(() => transactions.filter((t) => monthKey(t.date) === currentMonth), [transactions, currentMonth]);
  const income = useMemo(() => monthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0), [monthTx]);
  const expense = useMemo(() => monthTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0), [monthTx]);
  const saved = income - expense;
  const savingsRate = income > 0 ? (saved / income) * 100 : 0;
  const payday = nextPayday();
  const bankTotal = bankAccounts.reduce((s, a) => s + (a.balance || 0), 0);

  const cycles = useMemo(() => {
    const map = {};
    transactions.forEach((t) => {
      const q = quinzenaLabel(t.date);
      if (!map[q.key]) map[q.key] = { key: q.key, label: q.key.slice(5, 7) + "/" + q.short.slice(0, 1), order: q.order, income: 0, expense: 0 };
      if (t.type === "income") map[q.key].income += t.amount; else map[q.key].expense += t.amount;
    });
    return Object.values(map).sort((a, b) => a.order - b.order).slice(-6).map((c) => ({ ...c, saved: c.income - c.expense }));
  }, [transactions]);

  const catBreakdown = useMemo(() => {
    const map = {};
    monthTx.filter((t) => t.type === "expense").forEach((t) => { map[t.category] = (map[t.category] || 0) + t.amount; });
    return Object.entries(map).map(([k, v]) => ({ cat: k, value: v })).sort((a, b) => b.value - a.value);
  }, [monthTx]);

  const NAV = [
    { id: "dashboard", label: "Visão geral", icon: "wallet" },
    { id: "transactions", label: "Lançamentos", icon: "trending-up" },
    { id: "goals", label: "Metas", icon: "target" },
    { id: "calc", label: "Calculadoras", icon: "calculator" },
    { id: "bank", label: "Banco", icon: "landmark" },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", display: "flex", flexDirection: "column", fontFamily: bodyFont }}>
      <div style={{ padding: "20px 18px 14px", borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="piggy-bank" size={20} color={C.gold} />
            <span style={{ fontFamily: displayFont, fontSize: 20, color: C.text, letterSpacing: 0.2 }}>Quinto</span>
          </div>
          <Pill tone="gold">Faltam {payday.diff} dias p/ {payday.label}</Pill>
        </div>
      </div>

      <div style={{ padding: "16px 18px 4px" }}>
        <Card style={{ background: `linear-gradient(135deg, ${C.surface}, ${C.surfaceAlt})` }}>
          <div style={{ color: C.textMuted, fontSize: 12.5, marginBottom: 4 }}>Saldo deste mês</div>
          <div style={{ fontFamily: displayFont, fontSize: 34, color: saved >= 0 ? C.teal : C.brick, fontWeight: 500 }}>{fmt(saved)}</div>
          <div style={{ display: "flex", gap: 18, marginTop: 12 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 4, color: C.teal, fontSize: 12.5 }}><Icon name="arrow-up-right" size={14} /> Entradas</div>
              <div style={{ fontFamily: monoFont, color: C.text, fontSize: 15 }}>{fmt(income)}</div>
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 4, color: C.brick, fontSize: 12.5 }}><Icon name="arrow-down-right" size={14} /> Saídas</div>
              <div style={{ fontFamily: monoFont, color: C.text, fontSize: 15 }}>{fmt(expense)}</div>
            </div>
            <div>
              <div style={{ color: C.textMuted, fontSize: 12.5 }}>Taxa de poupança</div>
              <div style={{ fontFamily: monoFont, color: C.gold, fontSize: 15 }}>{savingsRate.toFixed(0)}%</div>
            </div>
          </div>
        </Card>
        {bankAccounts.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 4px 0" }}>
            <span style={{ color: C.textFaint, fontSize: 12, display: "flex", alignItems: "center", gap: 4 }}><Icon name="landmark" size={12} /> Saldo nas contas conectadas</span>
            <span style={{ fontFamily: monoFont, color: C.text, fontSize: 13 }}>{fmt(bankTotal)}</span>
          </div>
        )}
      </div>

      <div style={{ flex: 1, padding: "12px 18px 90px", overflowY: "auto" }}>
        {tab === "dashboard" && <Dashboard cycles={cycles} catBreakdown={catBreakdown} goals={goals} />}
        {tab === "transactions" && <Transactions transactions={transactions} setTransactions={setTransactions} />}
        {tab === "goals" && <Goals goals={goals} setGoals={setGoals} />}
        {tab === "calc" && <Calculators onCreateGoal={(g) => setGoals((prev) => [...prev, g])} />}
        {tab === "bank" && (
          <BankSync creds={bankCreds} setCreds={setBankCreds} accounts={bankAccounts} setAccounts={setBankAccounts}
            lastSync={lastSync} setLastSync={setLastSync} onSyncedTransactions={mergeSyncedTransactions} />
        )}
      </div>

      <div style={{ position: "sticky", bottom: 0, background: C.surface, borderTop: `1px solid ${C.border}`, display: "flex" }}>
        {NAV.map((n) => {
          const active = tab === n.id;
          return (
            <button key={n.id} onClick={() => setTab(n.id)} style={{ flex: 1, background: "transparent", border: "none", cursor: "pointer", padding: "10px 4px 12px", display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <Icon name={n.icon} size={19} color={active ? C.gold : C.textFaint} />
              <span style={{ fontSize: 10, color: active ? C.gold : C.textFaint, fontFamily: bodyFont }}>{n.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({ cycles, catBreakdown, goals }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Section title="Evolução por quinzena">
        {cycles.length === 0 ? <EmptyHint text="Adicione lançamentos para ver sua evolução por quinzena aqui." /> : <SimpleBarChart data={cycles} valueKey="saved" labelKey="label" />}
      </Section>
      <Section title="Gastos por categoria (este mês)">
        {catBreakdown.length === 0 ? <EmptyHint text="Nenhum gasto registrado neste mês ainda." /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {catBreakdown.map((c) => (
              <div key={c.cat}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                  <span style={{ color: C.text }}>{c.cat}</span>
                  <span style={{ fontFamily: monoFont, color: C.textMuted }}>{fmt(c.value)}</span>
                </div>
                <div style={{ height: 6, background: C.surfaceAlt, borderRadius: 4 }}>
                  <div style={{ height: 6, borderRadius: 4, background: C.gold, width: `${Math.min(100, (c.value / catBreakdown[0].value) * 100)}%` }} />
                </div>
              </div>
            ))}
          </div>
        )}
      </Section>
      <Section title="Metas em andamento">
        {goals.length === 0 ? <EmptyHint text="Crie uma meta na aba Metas para acompanhar aqui." /> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {goals.slice(0, 3).map((g) => (
              <div key={g.id}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                  <span style={{ color: C.text }}>{g.name}</span>
                  <span style={{ fontFamily: monoFont, color: C.textMuted }}>{fmt(g.current)} / {fmt(g.target)}</span>
                </div>
                <div style={{ height: 6, background: C.surfaceAlt, borderRadius: 4 }}>
                  <div style={{ height: 6, borderRadius: 4, background: C.teal, width: `${Math.min(100, (g.current / g.target) * 100)}%` }} />
                </div>
              </div>
            ))}
          </div>
        )}
      </Section>
    </div>
  );
}

function Transactions({ transactions, setTransactions }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ type: "expense", category: EXPENSE_CATS[0], description: "", amount: "", date: new Date().toISOString().slice(0, 10) });
  const sorted = useMemo(() => [...transactions].sort((a, b) => b.date.localeCompare(a.date)), [transactions]);

  function submit() {
    const amount = parseFloat(form.amount);
    if (!amount || amount <= 0) return;
    setTransactions((prev) => [...prev, { id: Date.now(), ...form, amount }]);
    setForm({ type: "expense", category: EXPENSE_CATS[0], description: "", amount: "", date: new Date().toISOString().slice(0, 10) });
    setOpen(false);
  }
  function remove(id) { setTransactions((prev) => prev.filter((t) => t.id !== id)); }
  const cats = form.type === "expense" ? EXPENSE_CATS : INCOME_CATS;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Button onClick={() => setOpen(true)}><Icon name="plus" size={16} /> Novo lançamento</Button>
      {sorted.length === 0 && <EmptyHint text="Nenhum lançamento ainda. Toque em “Novo lançamento” para começar." />}
      {sorted.map((t) => {
        const q = quinzenaLabel(t.date);
        return (
          <Card key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 14px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 34, height: 34, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", background: t.type === "income" ? C.tealSoft : C.brickSoft }}>
                <Icon name={t.type === "income" ? "arrow-up-right" : "arrow-down-right"} size={16} color={t.type === "income" ? C.teal : C.brick} />
              </div>
              <div>
                <div style={{ color: C.text, fontSize: 13.5 }}>{t.description || t.category}</div>
                <div style={{ color: C.textFaint, fontSize: 11.5 }}>{t.category} · {t.date.split("-").reverse().join("/")} · {q.short}{t.synced ? " · banco" : ""}</div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontFamily: monoFont, fontSize: 14, color: t.type === "income" ? C.teal : C.brick }}>{t.type === "income" ? "+" : "-"}{fmt(t.amount)}</span>
              <button onClick={() => remove(t.id)} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="trash" size={15} color={C.textFaint} /></button>
            </div>
          </Card>
        );
      })}
      {open && (
        <Modal onClose={() => setOpen(false)} title="Novo lançamento">
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            {["expense", "income"].map((ty) => (
              <button key={ty} onClick={() => setForm((f) => ({ ...f, type: ty, category: ty === "expense" ? EXPENSE_CATS[0] : INCOME_CATS[0] }))}
                style={{ flex: 1, padding: "9px 0", borderRadius: 10, cursor: "pointer", fontFamily: bodyFont, fontWeight: 600, fontSize: 13, border: `1px solid ${form.type === ty ? C.gold : C.border}`, background: form.type === ty ? C.goldSoft : "transparent", color: form.type === ty ? C.gold : C.textMuted }}>
                {ty === "expense" ? "Saída" : "Entrada"}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <NumberField label="Valor" value={form.amount} onChange={(v) => setForm((f) => ({ ...f, amount: v }))} suffix="R$" placeholder="0,00" />
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Categoria
              <select value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", color: C.text, fontFamily: bodyFont }}>
                {cats.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Descrição (opcional)
              <input value={form.description} onChange={(e) => setForm((f) => ({ ...f, description: e.target.value }))} style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", color: C.text, fontFamily: bodyFont }} />
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Data
              <input type="date" value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))} style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", color: C.text, fontFamily: bodyFont }} />
            </label>
            <Button onClick={submit} full>Salvar lançamento</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Goals({ goals, setGoals }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ name: "", target: "", current: "" });
  const [addTo, setAddTo] = useState(null);
  const [addAmount, setAddAmount] = useState("");

  function submit() {
    const target = parseFloat(form.target);
    if (!form.name || !target) return;
    setGoals((prev) => [...prev, { id: Date.now(), name: form.name, target, current: parseFloat(form.current) || 0 }]);
    setForm({ name: "", target: "", current: "" });
    setOpen(false);
  }
  function addValue() {
    const v = parseFloat(addAmount);
    if (!v) return;
    setGoals((prev) => prev.map((g) => (g.id === addTo ? { ...g, current: g.current + v } : g)));
    setAddAmount(""); setAddTo(null);
  }
  function remove(id) { setGoals((prev) => prev.filter((g) => g.id !== id)); }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Button onClick={() => setOpen(true)}><Icon name="plus" size={16} /> Nova meta</Button>
      {goals.length === 0 && <EmptyHint text="Crie metas como reserva de emergência, viagem ou entrada de imóvel." />}
      {goals.map((g) => {
        const pct = Math.min(100, (g.current / g.target) * 100);
        return (
          <Card key={g.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontFamily: displayFont, fontSize: 16, color: C.text }}>{g.name}</div>
                <div style={{ color: C.textMuted, fontSize: 12.5, marginTop: 2 }}>{fmt(g.current)} de {fmt(g.target)}</div>
              </div>
              <button onClick={() => remove(g.id)} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="trash" size={15} color={C.textFaint} /></button>
            </div>
            <div style={{ height: 8, background: C.surfaceAlt, borderRadius: 4, marginTop: 10 }}>
              <div style={{ height: 8, borderRadius: 4, background: pct >= 100 ? C.teal : C.gold, width: `${pct}%` }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, alignItems: "center" }}>
              <Pill tone={pct >= 100 ? "teal" : "muted"}>{pct.toFixed(0)}% concluído</Pill>
              <button onClick={() => setAddTo(g.id)} style={{ background: "none", border: "none", color: C.gold, fontSize: 12.5, cursor: "pointer", fontFamily: bodyFont, fontWeight: 600 }}>+ adicionar valor</button>
            </div>
          </Card>
        );
      })}
      {open && (
        <Modal onClose={() => setOpen(false)} title="Nova meta">
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Nome da meta
              <input value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="Ex: Reserva de emergência" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", color: C.text, fontFamily: bodyFont }} />
            </label>
            <NumberField label="Valor alvo" value={form.target} onChange={(v) => setForm((f) => ({ ...f, target: v }))} suffix="R$" />
            <NumberField label="Valor já guardado (opcional)" value={form.current} onChange={(v) => setForm((f) => ({ ...f, current: v }))} suffix="R$" />
            <Button onClick={submit} full>Criar meta</Button>
          </div>
        </Modal>
      )}
      {addTo && (
        <Modal onClose={() => setAddTo(null)} title="Adicionar valor à meta">
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <NumberField label="Valor a adicionar" value={addAmount} onChange={setAddAmount} suffix="R$" />
            <Button onClick={addValue} full>Adicionar</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function CompoundModal({ onClose }) {
  const [initial, setInitial] = useState("1000");
  const [monthly, setMonthly] = useState("300");
  const [rate, setRate] = useState("10");
  const [years, setYears] = useState("10");
  const result = useMemo(() => {
    const p = parseFloat(initial) || 0, m = parseFloat(monthly) || 0, r = (parseFloat(rate) || 0) / 100, y = parseInt(years) || 0;
    const monthlyRate = Math.pow(1 + r, 1 / 12) - 1;
    let balance = p, invested = p;
    const series = [{ month: 0, invested: p, total: p }];
    for (let i = 1; i <= y * 12; i++) {
      balance = balance * (1 + monthlyRate) + m;
      invested += m;
      if (i % 12 === 0) series.push({ month: i / 12, invested, total: balance });
    }
    const simple = p + p * r * y + m * 12 * y;
    return { balance, invested, interest: balance - invested, series, simple };
  }, [initial, monthly, rate, years]);

  return (
    <Modal title="Juros compostos" onClose={onClose}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
        <NumberField label="Valor inicial" value={initial} onChange={setInitial} suffix="R$" />
        <NumberField label="Aporte mensal" value={monthly} onChange={setMonthly} suffix="R$" />
        <NumberField label="Taxa de juros" value={rate} onChange={setRate} suffix="% a.a." />
        <NumberField label="Período" value={years} onChange={setYears} suffix="anos" />
      </div>
      <div style={{ marginBottom: 8 }}><SimpleLineChart series={result.series} /></div>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: C.textFaint, marginBottom: 14 }}>
        <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: C.textFaint, marginRight: 4 }} />Investido</span>
        <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: C.gold, marginRight: 4 }} />Total</span>
      </div>
      <StatRow label="Total investido" value={fmt(result.invested)} />
      <StatRow label="Juros ganhos" value={fmt(result.interest)} tone="teal" />
      <StatRow label="Total final" value={fmt(result.balance)} big />
      <div style={{ marginTop: 10, fontSize: 11.5, color: C.textFaint, fontStyle: "italic" }}>Para comparação, no juro simples (sem capitalização) o total estimado seria de {fmt(result.simple)}.</div>
    </Modal>
  );
}

function BankSync({ creds, setCreds, accounts, setAccounts, lastSync, setLastSync, onSyncedTransactions }) {
  const [clientId, setClientId] = useState(creds?.clientId || "");
  const [clientSecret, setClientSecret] = useState(creds?.clientSecret || "");
  const [showSecret, setShowSecret] = useState(false);
  const [status, setStatus] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");

  async function handleConnect() {
    if (!clientId || !clientSecret) return;
    setStatus("loading"); setErrorMsg("");
    try {
      const { accounts: fetchedAccounts, transactions: fetchedTx } = await syncPluggy(clientId, clientSecret);
      setCreds({ clientId, clientSecret });
      setAccounts(fetchedAccounts);
      onSyncedTransactions(fetchedTx);
      setLastSync(new Date().toISOString());
      setStatus("success");
    } catch (e) {
      setStatus("error");
      const isCors = e instanceof TypeError;
      setErrorMsg(isCors ? "Não consegui chamar a API (provável bloqueio de CORS). Pode ser necessário um pequeno proxy entre o app e a Pluggy." : e.message || "Erro ao sincronizar.");
    }
  }
  function disconnect() { setCreds(null); setAccounts([]); setClientId(""); setClientSecret(""); setStatus("idle"); }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
          <Icon name="landmark" size={18} color={C.gold} />
          <span style={{ fontFamily: displayFont, fontSize: 16, color: C.text }}>Conectar banco (Meu Pluggy)</span>
        </div>
        <div style={{ color: C.textFaint, fontSize: 12, lineHeight: 1.5, marginBottom: 14 }}>Suas credenciais ficam salvas só neste dispositivo, nunca saem daqui além das chamadas diretas para a API da Pluggy.</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Client ID
            <input value={clientId} onChange={(e) => setClientId(e.target.value)} placeholder="Cole seu Client ID" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "9px 12px", color: C.text, fontFamily: monoFont, fontSize: 13 }} />
          </label>
          <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12.5, color: C.textMuted }}>Client Secret
            <div style={{ display: "flex", alignItems: "center", background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 10, padding: "0 12px" }}>
              <input type={showSecret ? "text" : "password"} value={clientSecret} onChange={(e) => setClientSecret(e.target.value)} placeholder="Cole seu Client Secret" style={{ background: "transparent", border: "none", outline: "none", color: C.text, fontFamily: monoFont, fontSize: 13, padding: "9px 0", width: "100%" }} />
              <button onClick={() => setShowSecret((s) => !s)} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name={showSecret ? "eye-off" : "eye"} size={15} color={C.textFaint} /></button>
            </div>
          </label>
          <Button onClick={handleConnect} full><Icon name="refresh" size={15} style={status === "loading" ? { animation: "spin 1s linear infinite" } : {}} />{status === "loading" ? "Sincronizando..." : "Conectar e sincronizar"}</Button>
          {status === "error" && (
            <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: C.brickSoft, borderRadius: 10, padding: 10 }}>
              <Icon name="shield-alert" size={16} color={C.brick} style={{ flexShrink: 0, marginTop: 1 }} />
              <span style={{ color: C.brick, fontSize: 12.5, lineHeight: 1.4 }}>{errorMsg}</span>
            </div>
          )}
          {status === "success" && (
            <div style={{ display: "flex", gap: 8, alignItems: "center", background: C.tealSoft, borderRadius: 10, padding: 10 }}>
              <Icon name="check-circle" size={16} color={C.teal} /><span style={{ color: C.teal, fontSize: 12.5 }}>Sincronizado com sucesso.</span>
            </div>
          )}
        </div>
      </Card>
      {accounts.length > 0 && (
        <Card>
          <div style={{ fontFamily: displayFont, fontSize: 15, color: C.text, marginBottom: 10 }}>Contas conectadas</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {accounts.map((a) => (
              <div key={a.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: C.text }}>{a.name}</span>
                <span style={{ fontFamily: monoFont, color: C.textMuted }}>{fmt(a.balance)}</span>
              </div>
            ))}
          </div>
          {lastSync && <div style={{ color: C.textFaint, fontSize: 11.5, marginTop: 10 }}>Última sincronização: {new Date(lastSync).toLocaleString("pt-BR")}</div>}
          <div style={{ marginTop: 12 }}><Button variant="ghost" full onClick={disconnect}>Desconectar</Button></div>
        </Card>
      )}
      <div style={{ color: C.textFaint, fontSize: 11.5, lineHeight: 1.5, padding: "0 4px" }}>As transações importadas entram como entrada/saída com base no sinal do valor retornado pela Pluggy — vale revisar na aba Lançamentos, já que alguns bancos invertem esse sinal para cartão de crédito.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
